name: Build Android APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    name: Build Digital Detox APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          if [ -f "settings.gradle.kts" ] || [ -f "settings.gradle" ]; then
            PROJECT_DIR="."
          else
            SETTINGS_FILE="$(find . -type f \\( -name settings.gradle.kts -o -name settings.gradle \\) -not -path '*/.gradle/*' -print -quit)"
            if [ -z "$SETTINGS_FILE" ]; then
              echo "ERROR: Could not find settings.gradle(.kts). Make sure the Android project files are uploaded to this repository."
              echo "Repository files:"
              find . -maxdepth 4 -type f | sort | head -200
              exit 1
            fi
            PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          fi
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Android project found in: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle --no-daemon -p "${{ steps.project.outputs.project_dir }}" assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DigitalDetox-debug-apk
          path: ${{ steps.project.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

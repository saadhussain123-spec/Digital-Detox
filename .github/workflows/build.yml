
name: Build Digital Detox APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify and extract project ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="DigitalDetox-2.1-Kotlin-Fix.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::Required project archive '$ZIP_FILE' was not found in the repository root."
            echo "ZIP files currently in repository:"
            find . -maxdepth 3 -type f -iname '*.zip' -print
            exit 1
          fi

          unzip -t "$ZIP_FILE"
          mkdir -p android-project
          unzip -q "$ZIP_FILE" -d android-project

      - name: Locate and validate Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS_FILE="$(find android-project -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::No Gradle settings file found in the extracted ZIP."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "::error::The app directory is missing beside the Gradle settings file."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/build.gradle" ] && [ ! -f "$PROJECT_DIR/build.gradle.kts" ]; then
            echo "::error::The root Gradle build file is missing."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "::error::The app Gradle build file is missing."
            exit 1
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Validated Android project at: $PROJECT_DIR"

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: gradle --no-daemon clean assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DigitalDetox-debug-apk
          path: ${{ steps.project.outputs.project_dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

name: Build Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Verify project files
        run: |
          echo "Repository root:"
          pwd
          echo "Files:"
          ls -la
          if [ ! -f "./gradlew" ]; then
            echo "::error::gradlew was not found in the repository root. Upload the Android project with gradlew at the root, or adjust the workflow working directory."
            exit 1
          fi
          if [ ! -f "./settings.gradle" ] && [ ! -f "./settings.gradle.kts" ]; then
            echo "::error::settings.gradle or settings.gradle.kts was not found in the repository root."
            exit 1
          fi
          chmod +x ./gradlew

      - name: Build APK
        run: ./gradlew --no-daemon clean assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DigitalDetox-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

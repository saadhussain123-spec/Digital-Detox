name: Build Digital Detox APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project and locate Gradle settings
        id: project
        shell: bash
        run: |
          set -euo pipefail

          SEARCH_ROOT="$GITHUB_WORKSPACE"

          SETTINGS_FILE="$(find "$SEARCH_ROOT" -type f -name 'settings.gradle.kts' -not -path '*/.gradle/*' -print -quit || true)"
          if [ -z "$SETTINGS_FILE" ]; then
            SETTINGS_FILE="$(find "$SEARCH_ROOT" -type f -name 'settings.gradle' -not -path '*/.gradle/*' -print -quit || true)"
          fi

          if [ -z "$SETTINGS_FILE" ]; then
            ZIP_FILE="$(find "$GITHUB_WORKSPACE" -maxdepth 3 -type f -iname '*.zip' -print -quit || true)"

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: No Gradle settings file and no ZIP archive found in the repository."
              echo "Repository file list:"
              find "$GITHUB_WORKSPACE" -maxdepth 4 -type f | sort | head -200
              exit 1
            fi

            echo "Extracting project archive: $ZIP_FILE"
            EXTRACT_DIR="$RUNNER_TEMP/digital-detox-project"
            mkdir -p "$EXTRACT_DIR"
            unzip -q "$ZIP_FILE" -d "$EXTRACT_DIR"
            SEARCH_ROOT="$EXTRACT_DIR"

            SETTINGS_FILE="$(find "$SEARCH_ROOT" -type f -name 'settings.gradle.kts' -not -path '*/.gradle/*' -print -quit || true)"
            if [ -z "$SETTINGS_FILE" ]; then
              SETTINGS_FILE="$(find "$SEARCH_ROOT" -type f -name 'settings.gradle' -not -path '*/.gradle/*' -print -quit || true)"
            fi
          fi

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: No settings.gradle.kts or settings.gradle found, including inside the ZIP."
            find "$SEARCH_ROOT" -maxdepth 5 -type f | sort | head -250
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ] && [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "ERROR: app/build.gradle.kts or app/build.gradle is missing in: $PROJECT_DIR"
            find "$PROJECT_DIR" -maxdepth 4 -type f | sort | head -250
            exit 1
          fi

          echo "Android project found in: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle --no-daemon -p "${{ steps.project.outputs.project_dir }}" assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DigitalDetox-debug-apk
          path: ${{ steps.project.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
